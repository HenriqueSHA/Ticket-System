# CI/CD do Sistema de Ingressos (Equipe 11)
#
#  qualidade ─┐
#  postgres  ─┼─► imagens ─► deploy
#
# - CI (todo push e pull request): formatação, clippy sem avisos, testes, testes no PostgreSQL
#   real e build das imagens Docker do front e do back.
# - CD (push na main): publica as imagens no GitHub Container Registry (ghcr.io) e, se os
#   secrets do servidor existirem, atualiza o servidor por SSH.

name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  REGISTRO: ghcr.io

defaults:
  run:
    working-directory: codigo

jobs:
  qualidade:
    name: Formatação, clippy e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codigo
      - name: Formatação (cargo fmt)
        run: cargo fmt --all --check
      - name: Boas práticas (clippy, avisos viram erro)
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (domínio, cenários, API e ponta a ponta)
        run: cargo test

  postgres:
    name: Testes no PostgreSQL
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ingressos
          POSTGRES_PASSWORD: ingressos
          POSTGRES_DB: ingressos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ingressos"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codigo
      - name: Testes de integração (repositórios PostgreSQL + migrações)
        env:
          TESTE_POSTGRES: postgres://ingressos:ingressos@localhost:5433
        run: cargo test -p aplicacao --test postgres -- --ignored

  imagens:
    name: Imagens Docker (front e back)
    needs: [qualidade, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [back, front]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nome da imagem (ghcr.io/<dono>/ticket-system-<serviço>, em minúsculas)
        id: nome
        working-directory: .
        run: echo "imagem=${REGISTRO}/${GITHUB_REPOSITORY_OWNER,,}/ticket-system-${{ matrix.servico }}" >> "$GITHUB_OUTPUT"
      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (e publicação, só na main)
        uses: docker/build-push-action@v6
        with:
          context: codigo
          target: ${{ matrix.servico }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  deploy:
    name: Deploy no servidor (SSH)
    needs: imagens
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Cadastre em Settings → Secrets and variables → Actions:
      #   SERVIDOR_HOST, SERVIDOR_USUARIO, SERVIDOR_CHAVE_SSH (chave privada) e,
      #   opcionalmente, SERVIDOR_PASTA (padrão: ~/Ticket-System)
      SERVIDOR_HOST: ${{ secrets.SERVIDOR_HOST }}
    steps:
      - name: Servidor ainda não configurado
        if: env.SERVIDOR_HOST == ''
        working-directory: .
        run: echo "::notice::Deploy pulado — cadastre os secrets SERVIDOR_HOST, SERVIDOR_USUARIO e SERVIDOR_CHAVE_SSH."
      - name: Atualizar o servidor
        if: env.SERVIDOR_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USUARIO }}
          key: ${{ secrets.SERVIDOR_CHAVE_SSH }}
          script: |
            set -e
            PASTA='${{ secrets.SERVIDOR_PASTA }}'
            cd "${PASTA:-$HOME/Ticket-System}"
            git pull --ff-only
            docker compose pull back front
            docker compose up -d --no-build
            docker image prune -f
