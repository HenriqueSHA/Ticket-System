[workspace]
resolver = "3"
members = ["crates/dominio", "crates/aplicacao", "crates/infraestrutura", "crates/contrato", "crates/api", "crates/web"]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Equipe 11 — UNIFACS 2026.2"]

[workspace.dependencies]
dominio = { path = "crates/dominio" }
aplicacao = { path = "crates/aplicacao" }
infraestrutura = { path = "crates/infraestrutura" }
contrato = { path = "crates/contrato" }
api = { path = "crates/api" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal"] }

# Argon2 é lento sem otimização; otimiza só ele no modo de desenvolvimento (testes mais rápidos).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Padrão de qualidade: clippy "pedantic" em todo o workspace (o CI roda com -D warnings).
# Ficam de fora só as regras de documentação formal e de atributos que não ajudam a leitura.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
wildcard_imports = "allow"
