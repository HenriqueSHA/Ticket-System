# Banco de dados PostgreSQL do sistema de ingressos.
# Subir:  docker compose up -d      Parar:  docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: ingressos-postgres
    environment:
      POSTGRES_USER: ingressos
      POSTGRES_PASSWORD: ingressos
      POSTGRES_DB: ingressos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingressos"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dados-postgres:
